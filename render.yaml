# Render Blueprint – AHCL 360 API + admin panel (one web service).
# Render dashboard → New → Blueprint → select this GitHub repo → fill in MONGO_URI → Apply.
#
# FREE TIER (this file): no persistent disk, so uploaded files are stored (encrypted) in MongoDB,
# and the service sleeps after 15 minutes without traffic (the first request then takes ~1 minute).
# DEMO_MODE shows login OTPs on screen because no SMS provider is configured yet.
#
# To upgrade for real use: plan: starter, add the disk below, set UPLOAD_STORAGE=disk,
# set DEMO_MODE=false and SEED_DEMO=false, and configure SMS + Firebase (docs/DEPLOYMENT.md).
#   disk:
#     name: uploads
#     mountPath: /data
#     sizeGB: 5
services:
  - type: web
    name: ahcl360
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # MongoDB Atlas connection string, e.g. mongodb+srv://user:pass@cluster0.xxxx.mongodb.net/ahcl360
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Generated once by Render. NEVER change it later – encrypted data depends on it.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: UPLOAD_STORAGE
        value: mongo
      - key: DEMO_MODE
        value: "true"
      - key: SMS_PROVIDER
        value: console
      # Loads the demo accounts the first time (only into an empty database).
      - key: SEED_DEMO
        value: "true"
      - key: COMPANY_NAME
        value: AHCL
      - key: COMPANY_STATE_CODE
        value: "21"
